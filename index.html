<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F0F7"><title>Gym Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F0F7;--card:#fff;--ink:#14122B;--mut:#7A7891;--ac:#3B2FF0;--ln:#E4E2EE;--ok:#14A06B;--er:#E5384B;--soft:#F6F5FB}
[data-t=PUSH]{--tc:#FF6A3D}[data-t=PULL]{--tc:#2E8BFF}[data-t=LEGS]{--tc:#12B76A}[data-t=UPPER]{--tc:#8B5CF6}[data-t="CHEST+ARM"]{--tc:#EC4899}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
h1,h2,.big{font-family:'Barlow Condensed',sans-serif;font-weight:700}
h1{font-size:28px;letter-spacing:.3px}h2{font-size:22px;margin:4px 0 8px}
#app{padding:0 14px 20px;max-width:560px;margin:auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.grid .card{margin:0;border-radius:16px}
.k,.mut{color:var(--mut);font-size:12px}.big{font-size:28px;line-height:1.1}
.big small{font-size:16px;margin-left:6px;opacity:.7;font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:600}
.pri{background:var(--ac);width:100%;font:700 20px 'Barlow Condensed',sans-serif;padding:16px;margin-bottom:10px;border-radius:16px}
.fin{background:var(--ok)}
.ghost{background:none;color:var(--ac);border:1.5px dashed var(--ac);width:100%;margin-top:8px}
.x{background:none;color:var(--mut);padding:4px 8px;font-size:18px}
.hero{background:var(--ac);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px}
.hero .k{color:#fffa}.hero .big{font-size:68px;line-height:.95;margin-top:2px}
.wk{display:flex;justify-content:space-between;margin-top:16px}
.wk span{width:36px;height:36px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-weight:600;font-size:13px;color:#ffffffcc}
.wk span.on{background:var(--tc);color:#fff;box-shadow:0 0 0 2px #fff}
.go{background:#fff;color:var(--ac);width:100%;margin-top:16px;font:700 20px 'Barlow Condensed',sans-serif;padding:14px;border-radius:14px}
.ah{background:var(--tc);color:#fff;border-radius:20px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end}.ah .big{font-size:42px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:#fff;color:var(--ink);padding:8px 14px;border-radius:99px}
.chip[data-t]{box-shadow:inset 0 -3px 0 var(--tc)}
.chip.on{background:var(--tc,var(--ink));color:#fff;box-shadow:none}
input,select,textarea{font:inherit;padding:11px 12px;border:1.5px solid transparent;border-radius:12px;width:100%;background:var(--soft);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--ac);background:#fff}
.set{display:grid;grid-template-columns:58px 1fr 1fr 56px 26px;gap:5px;align-items:center;margin-top:8px}
.set input{text-align:center;font-weight:600;font-size:17px;padding:12px 4px}
.set small{display:block;color:var(--mut);font-size:11px}
.xn{position:absolute;right:6px;top:6px}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.pill{font-size:13px;background:#fff;color:var(--ink);padding:6px 12px;border-radius:99px}
.dk{background:var(--ink)!important;color:#fff}.dk .k{color:#fff9}
.ins{background:#E9E7FF!important}.ins p{margin-top:4px}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:2px 0 8px}.bar i{display:block;height:100%;background:var(--tc);border-radius:9px}
.hc{border-left:6px solid var(--tc)}
.bd{background:var(--tc);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:4px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);border-radius:24px;padding:6px;z-index:6;max-width:536px;margin:auto}
nav button{background:none;color:#ffffff99;padding:8px 2px;font-size:11px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{background:#ffffff24;color:#fff}
.mod{position:fixed;inset:0;background:#0008;display:flex;z-index:9}
.mod>div{background:#fff;width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}
.ch{width:100%;height:auto}
.pr{background:#FFF4CC;border:1px solid #F5B700;color:#6b5000;font-weight:600}
.t5{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.t5 button{background:var(--tc);font:700 22px 'Barlow Condensed',sans-serif;padding:20px;border-radius:18px}.t5 button:first-child{grid-column:span 2}
label{display:block;margin-top:8px}
</style></head><body>
<header><h1>Gym Log</h1><button class="pill" id="pill" onclick="cfg()">⚪</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<datalist id="dl"></datalist>
<script>
const TYPES=['PUSH','PULL','LEGS','UPPER','CHEST+ARM'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],K='gymlog_v1';
const DEF_EX=['Bench Press','Incline Bench Press','Incline Dumbbell Press','Dumbbell Press','Shoulder Press','Lat Pulldown','Seated Row','Barbell Row','Cable Row','Face Pull','Squat','Leg Press','Leg Extension','Leg Curl','Romanian Deadlift','Calf Raise','Dumbbell Curl','Bicep Curl','Tricep Pushdown','Lateral Raise'];
const DEF_TPL={PUSH:['Bench Press','Incline Dumbbell Press','Shoulder Press','Lateral Raise','Tricep Pushdown'],PULL:['Lat Pulldown','Seated Row','Face Pull','Dumbbell Curl'],LEGS:['Squat','Leg Press','Leg Extension','Leg Curl','Calf Raise'],UPPER:['Bench Press','Lat Pulldown','Shoulder Press','Seated Row','Lateral Raise','Bicep Curl','Tricep Pushdown'],'CHEST+ARM':['Bench Press','Incline Dumbbell Press','Dumbbell Press','Dumbbell Curl','Bicep Curl','Tricep Pushdown']};
const $=s=>document.querySelector(s),num=v=>Math.round(v*10)/10,fmt=n=>Math.round(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0'),slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const newWid=()=>{const d=new Date();return 'W'+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),fd=s=>{const [y,m,d]=s.split('-');return d+' '+MON[m-1]+' '+y};
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const mon=s=>addD(s,-((new Date(s+'T00:00:00').getDay()+6)%7));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=load(),tab='dash',tplT='PUSH',hf={t:'',m:today().slice(0,7)},pe='',syncing=false,stat='off';
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s){if(!s.tpl['CHEST+ARM'])s.tpl['CHEST+ARM']=DEF_TPL['CHEST+ARM'];return s}}catch(e){}
 return{workouts:[],sets:[],exercises:DEF_EX.map((n,i)=>({id:'E'+(i+1),name:n,active:true})),body:[],prs:[],tpl:DEF_TPL,q:[],url:'',active:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

/* ---------- Sync (offline queue -> Google Apps Script) ---------- */
function setSt(s){stat=s;const p=$('#pill');if(!p)return;const n=S.q.length;
 p.textContent={ok:'🟢 Synced',sync:'🟡 Syncing',err:'🔴 Sync Error'+(n?' ('+n+')':''),off:'⚪ Belum terhubung'+(n?' ('+n+')':'')}[s]}
function enq(sheet,rows){S.q.push({sheet,rows});save();sync()}
async function sync(){
 if(!S.url){setSt('off');return}
 if(syncing)return;syncing=true;
 while(S.q.length){setSt('sync');
  try{const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(S.q[0])});
   const j=await r.json();if(!j.ok)throw 0;S.q.shift();save()}
  catch(e){setSt('err');syncing=false;return}}
 syncing=false;setSt('ok')}
async function pull(){
 await sync();if(S.q.length)return alert('Masih ada data yang belum terkirim. Coba lagi setelah 🟢 Synced.');
 try{const j=await(await fetch(S.url+'?action=all')).json(),n=x=>x===''||x==null?'':+x;
  if(j.WORKOUTS.length){S.workouts=j.WORKOUTS.map(r=>({id:r.workout_id,date:r.date,type:r.workout_type,dur:n(r.duration)||0,vol:n(r.total_volume)||0,notes:r.notes}));
   S.sets=j.SETS.map(r=>({id:r.set_id,wid:r.workout_id,ex:r.exercise,n:+r.set_number,w:+r.weight,r:+r.reps,rpe:n(r.rpe),vol:+r.volume,notes:r.notes}))}
  if(j.EXERCISES.length)S.exercises=j.EXERCISES.map(r=>({id:r.exercise_id,name:r.exercise_name,active:r.active!==false&&r.active!=='FALSE'}));
  if(j.BODY_PROGRESS.length)S.body=j.BODY_PROGRESS.map(r=>({date:r.date,w:n(r.weight),waist:n(r.waist),bf:n(r.body_fat),mm:n(r.muscle_mass),notes:r.notes}));
  if(j.PERSONAL_RECORDS.length)S.prs=j.PERSONAL_RECORDS.map(r=>({date:r.date,ex:r.exercise,type:r.record_type,w:+r.weight,r:+r.reps,vol:+r.volume}));
  save();render();alert('Data dari Google Sheets dimuat.')}catch(e){setSt('err');alert('Gagal menarik data. Periksa URL Web App.')}}
function cfg(){const m=document.createElement('div');m.className='mod';m.id='cfg';
 m.innerHTML=`<div><h2>Google Sheets</h2><label class="k">URL Web App (Apps Script)</label><input id="u" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/.../exec">
 <p class="mut" style="margin:8px 0">Antrean belum terkirim: ${S.q.length}</p>
 <button style="width:100%;margin-top:6px" onclick="saveUrl()">Simpan &amp; Sync</button>
 <button style="width:100%;margin-top:8px;background:#fff;color:var(--ink);border:1px solid var(--ln)" onclick="pull()">Tarik data dari Sheets</button>
 <button style="width:100%;margin-top:8px;background:none;color:var(--mut)" onclick="$('#cfg').remove()">Tutup</button></div>`;
 document.body.appendChild(m)}
function saveUrl(){S.url=$('#u').value.trim();
 if(S.url&&!S.exSynced){S.exSynced=true;S.q.push({sheet:'EXERCISES',rows:S.exercises.map(e=>[e.id,e.name,e.active])})}
 save();$('#cfg').remove();sync()}

/* ---------- Data helpers ---------- */
const bs=k=>S.body.filter(b=>b[k]!==''&&b[k]!=null).sort((a,b)=>a.date<b.date?-1:1);
const wsorted=()=>[...S.workouts].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function exH(ex){const m={};S.sets.filter(s=>s.ex===ex).forEach(s=>(m[s.wid]=m[s.wid]||[]).push(s));
 return Object.entries(m).map(([id,ss])=>{const w=S.workouts.find(x=>x.id===id);return{date:w?w.date:'',ss,mw:Math.max(...ss.map(s=>s.w))}}).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function chart(pts,u){pts=pts.slice(-30);if(pts.length<2)return'<p class="mut">Butuh minimal 2 data untuk grafik.</p>';
 const W=320,H=120,p=18,vs=pts.map(x=>x.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn==mx){mn-=1;mx+=1}
 const X=i=>p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
 return`<svg viewBox="0 0 ${W} ${H}" class="ch"><polygon fill="#3B2FF0" opacity=".1" points="${X(0)},${H-p} ${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')} ${X(pts.length-1)},${H-p}"/><polyline fill="none" stroke="#3B2FF0" stroke-width="2.5" points="${pts.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3" fill="#3B2FF0"/>`).join('')}<text x="2" y="12" font-size="10" fill="#6B7480">${num(mx)}${u}</text><text x="2" y="${H-4}" font-size="10" fill="#6B7480">${num(mn)}${u}</text></svg>`}
const tile=(k,v,c='')=>`<div class="card ${c}"><div class="k">${k}</div><div class="big">${v}</div></div>`;

/* ---------- Views ---------- */
function dash(){
 const w=bs('w'),lw=w[w.length-1],pw=w[w.length-2],wa=bs('waist'),la=wa[wa.length-1],ws=wsorted(),last=ws[ws.length-1];
 const t=today(),wk=mon(t),pk=addD(wk,-7),ym=t.slice(0,7);
 const inW=ws.filter(x=>mon(x.date)===wk),inM=ws.filter(x=>x.date.slice(0,7)===ym);
 const vW=inW.reduce((a,x)=>a+x.vol,0),vP=ws.filter(x=>mon(x.date)===pk).reduce((a,x)=>a+x.vol,0);
 const wkS=new Set(ws.map(x=>mon(x.date)));let c=0,cur=wk;if(!wkS.has(cur))cur=pk;while(wkS.has(cur)){c++;cur=addD(cur,-7)}
 const ins=['Workout minggu ini: '+inW.length];if(vP&&vW)ins.push(`Volume minggu ini ${vW>=vP?'naik':'turun'} ${Math.abs(Math.round((vW-vP)/vP*100))}% dibanding minggu lalu.`);
 let ups=0;if(last){[...new Set(S.sets.filter(s=>s.wid===last.id).map(s=>s.ex))].forEach(e=>{const h=exH(e);if(h.length>1){const d=h[h.length-1].mw-h[h.length-2].mw;if(d>0)ups++;if(d)ins.push(`${e}: ${d>0?'+':''}${num(d)} kg dibanding workout sebelumnya.`)}})}
 if(lw&&pw)ins.push(`Berat badan: ${pw.w} kg → ${lw.w} kg.`);
 const wd=[0,1,2,3,4,5,6].map(i=>{const d=addD(wk,i),w=ws.find(x=>x.date===d);return`<span ${w?`class="on" data-t="${w.type}"`:''} ${d===t?'style="outline:2px dashed #fffa;outline-offset:2px"':''}>${'SSRKJSM'[i]}</span>`}).join('');
 return`<div class="hero"><div class="k">Minggu ini</div><div class="big">${inW.length}<small>workout</small></div><div class="wk">${wd}</div><button class="go" onclick="tab='workout';render()">${S.active?'Lanjutkan '+S.active.type:'Start Workout'}</button></div>`+
 `<div class="grid">${tile('Berat badan',lw?lw.w+' kg':'–')}${tile('Perubahan',lw&&pw?(lw.w-pw.w>0?'+':'')+num(lw.w-pw.w)+' kg':'–')}${tile('Lingkar pinggang',la?la.waist+' cm':'–')}${tile('Streak',c+' minggu')}
 ${tile('Volume minggu ini',fmt(vW)+' kg')}${tile('Bulan ini',inM.length+' workout')}${tile('Total volume',fmt(ws.reduce((a,x)=>a+x.vol,0))+' kg','dk')}${tile('Progress strength',ups+' exercise naik')}</div>
 <div class="card"><div class="k">Workout terakhir</div>${last?`<b>${last.type}</b> · ${fd(last.date)} · ${fmt(last.vol)} kg`:'Belum ada workout.'}</div>
 <div class="card"><div class="k">Frekuensi bulan ini</div>${TYPES.map(x=>{const n=inM.filter(m=>m.type===x).length,mx=Math.max(1,...TYPES.map(y=>inM.filter(m=>m.type===y).length));return`<div class="row"><span>${x}</span><b>${n} kali</b></div><div class="bar" data-t="${x}"><i style="width:${n/mx*100}%"></i></div>`}).join('')}</div>
 <div class="card ins"><div class="k">Insight</div>${ins.map(i=>`<p>${i}</p>`).join('')}</div>
 <div class="card"><div class="k">Grafik berat badan</div>${chart(w.map(b=>({v:b.w})),' kg')}</div>
 <div class="card"><div class="k">Grafik lingkar pinggang</div>${chart(wa.map(b=>({v:b.waist})),' cm')}</div>`}

function workout(){
 if(S.active)return act();
 const l=S.tpl[tplT]||[];
 return`<h2>Pilih workout</h2><div class="t5">${TYPES.map(t=>`<button data-t="${t}" onclick="start('${t}')">${t}</button>`).join('')}</div>
 <h2>Template</h2><div class="chips">${TYPES.map(t=>`<button data-t="${t}" class="chip ${t===tplT?'on':''}" onclick="tplT='${t}';render()">${t}</button>`).join('')}</div>
 <div class="card">${l.map((e,i)=>`<div class="row"><span>${esc(e)}</span><button class="x" onclick="tplRm(${i})">×</button></div>`).join('')||'<p class="mut">Template kosong.</p>'}
 <div style="display:flex;gap:6px;margin-top:8px"><input id="tn" list="dl" placeholder="Tambah exercise ke ${tplT}"><button onclick="tplAdd()">Tambah</button></div></div>`}
function act(){const a=S.active;
 return`<div class="ah" data-t="${a.type}"><div class="big">${a.type}</div><div>${fd(a.date)}</div></div>`+a.ex.map((e,i)=>`<div class="card"><b>${esc(e.name)}</b><button class="x xn" onclick="rmEx(${i})">×</button>`+
 e.sets.map((s,j)=>`<div class="set"><span>Set ${j+1}<small id="v${i}_${j}">${vol(s)}</small></span><input inputmode="decimal" placeholder="kg" value="${s.w}" oninput="up(${i},${j},'w',this.value)"><input inputmode="numeric" placeholder="reps" value="${s.r}" oninput="up(${i},${j},'r',this.value)"><input inputmode="decimal" placeholder="RPE" value="${s.rpe}" oninput="up(${i},${j},'rpe',this.value)"><button class="x" onclick="rmSet(${i},${j})">×</button></div>`).join('')+
 `<button class="ghost" onclick="addSet(${i})">+ Add Set</button><input style="margin-top:8px" placeholder="Catatan (opsional)" value="${esc(e.notes)}" oninput="S.active.ex[${i}].notes=this.value;save()"></div>`).join('')+
 `<div class="card"><div style="display:flex;gap:6px"><input id="nx" list="dl" placeholder="Nama exercise"><button onclick="addEx()">Add</button></div><button class="ghost" onclick="addEx()">+ Add Exercise</button></div>
 <input placeholder="Catatan workout (opsional)" value="${esc(a.notes)}" oninput="S.active.notes=this.value;save()" style="margin-bottom:10px">
 <button class="pri fin" onclick="finish()">Finish Workout</button><button class="x" style="width:100%" onclick="if(confirm('Batalkan workout ini?')){S.active=null;save();render()}">Batalkan workout</button>`}

function hist(){
 const ws=wsorted().reverse().filter(w=>(!hf.t||w.type===hf.t)&&(!hf.m||w.date.slice(0,7)===hf.m)),inM=S.workouts.filter(w=>!hf.m||w.date.slice(0,7)===hf.m);
 return`<h2>History</h2><input type="month" value="${hf.m}" onchange="hf.m=this.value;render()"><div class="chips"><button class="chip ${!hf.t?'on':''}" onclick="hf.t='';render()">Semua</button>${TYPES.map(t=>`<button data-t="${t}" class="chip ${hf.t===t?'on':''}" onclick="hf.t='${t}';render()">${t}</button>`).join('')}</div>
 <div class="card">${TYPES.map(t=>`<div class="row"><span>${t}</span><b>${inM.filter(w=>w.type===t).length} workouts</b></div>`).join('')}</div>`+
 (ws.map(w=>{const ss=S.sets.filter(s=>s.wid===w.id),ex=[...new Set(ss.map(s=>s.ex))];
  return`<div class="card hc" data-t="${w.type}"><b>${fd(w.date)}</b><span class="bd">${w.type}</span><div class="mut">${w.dur} menit · Total ${fmt(w.vol)} kg</div>`+ex.map(e=>`<p style="margin-top:6px"><b>${esc(e)}</b><br>${ss.filter(s=>s.ex===e).map(s=>`${s.w} × ${s.r}`).join('<br>')}</p>`).join('')+(w.notes?`<p class="mut">${esc(w.notes)}</p>`:'')+`</div>`}).join('')||'<p class="mut">Tidak ada workout.</p>')}

function prog(){
 const names=[...new Set(S.sets.map(s=>s.ex))].sort();
 if(!names.length)return'<h2>Progress</h2><p class="mut">Selesaikan workout pertama untuk melihat progress.</p>';

 if(!names.includes(pe))pe=names[0];

 const h=exH(pe),
       all=S.sets.filter(s=>s.ex===pe),
       str=x=>x?x.ss.map(s=>`${s.w}×${s.r}`).join(', '):'–',
       L=h[h.length-1],
       P=h[h.length-2];

 // Set terakhir pada workout terakhir exercise ini
 const current=L?.ss?.length ? L.ss[L.ss.length-1] : null;

 const seq=h.map(x=>x.mw)
   .filter((v,i,a)=>i===0||v!==a[i-1])
   .slice(-8)
   .join(' → ');

 return`
 <h2>Progress</h2>

 <select onchange="pe=this.value;render()">
   ${names.map(n=>`<option ${n===pe?'selected':''}>${esc(n)}</option>`).join('')}
 </select>

 <div class="grid" style="margin-top:10px">
   ${tile('Beban terkini',current?current.w+' kg':'–')}
   ${tile('Reps terkini',current?current.r+' reps':'–')}
   ${tile('Best weight',Math.max(...all.map(s=>s.w))+' kg')}
   ${tile('Best reps',Math.max(...all.map(s=>s.r)))}
 </div>

 <div class="card">
   <div class="row">
     <span class="k">Workout terakhir</span>
     <span>${L?fd(L.date):''}</span>
   </div>
   ${str(L)}

   <div class="row" style="margin-top:6px">
     <span class="k">Previous workout</span>
     <span>${P?fd(P.date):''}</span>
   </div>
   ${str(P)}
 </div>

 <div class="card">
   <div class="k">${esc(pe)} progress</div>
   <p>${seq}</p>
   ${chart(h.map(x=>({v:x.mw})),' kg')}
 </div>

 <div class="card">
   <div class="k">Personal record</div>
   ${S.prs.filter(p=>p.ex===pe).reverse().map(p=>
     `<div class="row">
       <span>🏆 ${p.type}</span>
       <span>${p.w} kg × ${p.r} · ${fd(p.date)}</span>

   ).join('')||'<p class="mut">Belum ada PR.</p>'}
 </div>`;
}

function body(){
 const L=[...S.body].sort((a,b)=>a.date<b.date?1:-1).slice(0,10);
 return`<h2>Body</h2><div class="card"><label class="k">Tanggal</label><input id="bd" type="date" value="${today()}">
 <div class="grid" style="margin-top:0"><div><label class="k">Berat (kg)</label><input id="bw" inputmode="decimal"></div><div><label class="k">Pinggang (cm)</label><input id="bp" inputmode="decimal"></div><div><label class="k">Body fat % (opsional)</label><input id="bf" inputmode="decimal"></div><div><label class="k">Muscle mass (opsional)</label><input id="bm" inputmode="decimal"></div></div>
 <input id="bn" placeholder="Catatan" style="margin:8px 0"><button class="pri" style="margin:0;font-size:18px" onclick="saveBody()">Simpan</button></div>
 <div class="card"><div class="k">Weight progress</div>${chart(bs('w').map(b=>({v:b.w})),' kg')}</div>
 <div class="card"><div class="k">Waist progress</div>${chart(bs('waist').map(b=>({v:b.waist})),' cm')}</div>
 <div class="card">${L.map(b=>`<div class="row"><span>${fd(b.date)}</span><span>${b.w!==''?b.w+' kg':'–'} · ${b.waist!==''?b.waist+' cm':'–'}</span></div>`).join('')||'<p class="mut">Belum ada data.</p>'}</div>`}

/* ---------- Actions ---------- */
const vol=s=>fmt((+s.w||0)*(+s.r||0))+' kg';
function start(t){S.active={type:t,date:today(),start:Date.now(),notes:'',ex:(S.tpl[t]||[]).map(blank)};save();render()}
function blank(n){const l=[...S.sets].reverse().find(s=>s.ex===n);return{name:n,notes:'',sets:[{w:l?l.w:'',r:l?l.r:'',rpe:''}]}}
function ensureEx(n){const f=S.exercises.find(e=>e.name.toLowerCase()===n.toLowerCase());if(f)return f.name;
 const e={id:'E-'+slug(n),name:n,active:true};S.exercises.push(e);enq('EXERCISES',[[e.id,e.name,true]]);return n}
function addEx(){const v=$('#nx').value.trim();if(!v)return;S.active.ex.push(blank(ensureEx(v)));save();render()}
function addSet(i){const e=S.active.ex[i],l=e.sets[e.sets.length-1]||{w:'',r:''};e.sets.push({w:l.w,r:l.r,rpe:''});save();render()}
function rmSet(i,j){S.active.ex[i].sets.splice(j,1);save();render()}
function rmEx(i){S.active.ex.splice(i,1);save();render()}
function up(i,j,k,v){S.active.ex[i].sets[j][k]=v;save();const el=$('#v'+i+'_'+j);if(el)el.textContent=vol(S.active.ex[i].sets[j])}
function tplAdd(){const v=$('#tn').value.trim();if(!v)return;(S.tpl[tplT]=S.tpl[tplT]||[]).push(ensureEx(v));save();render()}
function tplRm(i){S.tpl[tplT].splice(i,1);save();render()}
function finish(){const a=S.active,exs=a.ex.map(e=>({...e,sets:e.sets.filter(s=>+s.w>0&&+s.r>0)})).filter(e=>e.sets.length);
 if(!exs.length)return alert('Isi minimal satu set (berat dan reps).');
 const wid=newWid(),dur=Math.max(1,Math.round((Date.now()-a.start)/60000)),prs=[],rows=[];let tv=0,sn=0;
 exs.forEach(e=>{const pv=S.sets.filter(s=>s.ex===e.name),sets=e.sets.map(s=>({w:+s.w,r:+s.r,v:+s.w*+s.r})),best=(f)=>sets.reduce((m,s)=>f(s)>f(m)?s:m);
  if(pv.length)[['Maximum Weight',s=>s.w,p=>p.w],['Maximum Reps',s=>s.r,p=>p.r],['Maximum Volume',s=>s.v,p=>p.vol]].forEach(([n,f,g])=>{const b=best(f),old=pv.reduce((m,p)=>g(p)>g(m)?p:m);
   if(f(b)>g(old))prs.push({date:a.date,ex:e.name,type:n,w:b.w,r:b.r,vol:b.v,pw:old.w,pr:old.r})});
  e.sets.forEach((s,j)=>{const o={id:'S'+wid.slice(1)+'-'+pad(++sn),wid,ex:e.name,n:j+1,w:+s.w,r:+s.r,rpe:s.rpe===''?'':+s.rpe,vol:+s.w*+s.r,notes:e.notes||''};tv+=o.vol;S.sets.push(o);rows.push(o)})});
 const w={id:wid,date:a.date,type:a.type,dur,vol:tv,notes:a.notes};S.workouts.push(w);S.prs.push(...prs.map(({pw,pr,...p})=>p));S.active=null;save();
 S.q.push({sheet:'WORKOUTS',rows:[[w.id,w.date,w.type,w.dur,w.vol,w.notes]]},{sheet:'SETS',rows:rows.map(o=>[o.id,o.wid,o.ex,o.n,o.w,o.r,o.rpe,o.vol,o.notes])});
 if(prs.length)S.q.push({sheet:'PERSONAL_RECORDS',rows:prs.map(p=>[p.date,p.ex,p.type,p.w,p.r,p.vol])});
 save();sync();tab='hist';hf={t:'',m:a.date.slice(0,7)};render();
 const m=document.createElement('div');m.className='mod';m.onclick=()=>m.remove();
 m.innerHTML=`<div><h2>Workout selesai</h2><p>${a.type} · ${dur} menit · ${fmt(tv)} kg</p>${prs.map(p=>`<div class="card pr">🏆 NEW PR — ${esc(p.ex)}<br>${p.type}: ${p.w} kg × ${p.r}<div class="mut">Previous: ${p.pw} kg × ${p.pr}</div></div>`).join('')}<button style="width:100%;margin-top:8px">OK</button></div>`;document.body.appendChild(m)}
function saveBody(){const n=id=>$(id).value===''?'':+$(id).value.replace(',','.'),d=$('#bd').value;
 const r={date:d,w:n('#bw'),waist:n('#bp'),bf:n('#bf'),mm:n('#bm'),notes:$('#bn').value};
 if(!d||(r.w===''&&r.waist===''))return alert('Isi tanggal dan minimal berat atau pinggang.');
 S.body=S.body.filter(b=>b.date!==d);S.body.push(r);save();enq('BODY_PROGRESS',[[r.date,r.w,r.waist,r.bf,r.mm,r.notes]]);render()}

const NAV=[['dash','<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>','Dashboard'],['workout','<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>','Workout'],['hist','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>','History'],['prog','<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>','Progress'],['body','<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9a4 4 0 016 0M12 12l2-2"/>','Body']],V={dash,workout,hist,prog,body};
function render(){const y=scrollY;$('#app').innerHTML=V[tab]();
 $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${i}</svg>${l}</button>`).join('');
 $('#dl').innerHTML=S.exercises.filter(e=>e.active).map(e=>`<option value="${esc(e.name)}">`).join('');
 setSt(stat);scrollTo(0,y)}
addEventListener('online',sync);setInterval(sync,30000);
render();sync();
</script></body></html>
